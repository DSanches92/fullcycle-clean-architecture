services:
  mysql:
    image: mysql:8.0
    container_name: orders_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: orders_app
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: orders
      REST_PORT: "3000"
      GRPC_PORT: "3002"
      GRAPHQL_PORT: "3001"
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: