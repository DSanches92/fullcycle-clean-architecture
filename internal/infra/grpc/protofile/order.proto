syntax = "proto3";

package pb;

option go_package = "github.com/DSanches92/fullcycle-clean-architecture/internal/infra/grpc/protofile/pb";

message Blank {}

message OrderResponse {
  string id = 1;
  float price = 2;
  float tax = 3;
  float final_price = 4;
}

message OrderList {
  repeated OrderResponse orders = 1;
}

message CreateOrderRequest {
  string id = 1;
  float price = 2;
  float tax = 3;
}

service OrderService {
  rpc ListOrders(Blank) returns (OrderList);
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
}